<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="/src/output.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="tailwind.config.js">

  <title>Add Up Number</title>
</head>
<body class="bg-sky-500">

       <div class="w-1/3 h-auto bg-sky-600/50 p-10 mx-auto my-20 text-center rounded-2xl space-y-10
      shadow-lg shadow-sky-300">
          <h1 class="text-2xl font-bold text-white">Addup the Number</h1>
          <span class="capitalize text-white">This challenge calculate the sum of this number from one to own</span>
          <input type="number" min="1" placeholder="Please Enter Your number :"
          class="border-2 border-sky-300 w-full p-3 rounded-2xl outline-0 text-xl mt-5 
          focus:duration-500 shadow-lg shadow-sky-400 text-white">
          <button type="button" class="border-2 border-sky-100 px-10 py-3 rounded-lg hover:bg-sky-400
          hover:text-white duration-700 hover:translate-y-3 hover:cursor-pointer hover:shadow-lg hover:shadow-sky-400
          font-semibold">Result</button>
          <p class="text-3xl mt-5"></p>
       </div>

       <script src="index.js"></script>
</body>
</html>
